<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" type="module"></script>
    <title>Celulose³</title>
</head>

<body>

    <header>
        <div class="header-menu">
            <button type="button" class="menuButton" id="menuButton"></button>
            <menu class="menu" id="menu" hidden>
                <a class="menu__item" href="index.html">HOME</a>
                <a class="menu__item active">CATÁLOGO</a>
                <a class="menu__item" href="contato.html">CONTATO</a>
            </menu>
        </div>

        <a href="index.html"><img src="img/logo.svg" alt="logomarca" class="header-logo"></a>

        <button type="button" class="carrinhoButton" id="toggle-carrinho"
            aria-label="Abrir carrinho de compras" aria-controls="cart-drawer" aria-expanded="false">
            <span class="carrinho-count" aria-live="polite" hidden>0</span>
        </button>
    </header>

    <main>
        <h2 id="catalogo-heading">Catálogo</h2>
        <div class="catalog-controls">
            <div class="div-buscar">
                <label for="buscar">Buscar livro</label>
                <input type="search" name="buscar" id="buscar" aria-label="Buscar livros por título ou autor" placeholder="Título ou autor">
            </div>
            <div class="div-categoria">
                <label for="filtro-categoria">Categoria</label>
                <select id="filtro-categoria" aria-label="Filtrar livros por categoria">
                    <option value="">Todas as categorias</option>
                </select>
            </div>
        </div>

        <div class="container-catalogo">
            <!-- Cards dinâmicos aqui -->
        </div>

    </main>

    <footer>

        <div class="footer-info">

            <div class="footer-enderecos">
                <h2>Endereços</h2>
                <p>Av Belmira Marin, 1006 - Pq Brasil</p>
                <p>Av. Paulista, 1230 - Bela Vista</p>
            </div>

            <div class="footer-social">
                <h2>Social</h2>
                <nav>
                    <ul>
                        <li><a href="https://www.x.com/"><img src="img/twitter.svg" alt="twitter"></a></li>
                        <li><a href="https://www.instagram.com/"><img src="img/instagram.svg" alt="instagram"></a></li>
                        <li><a href="https://www.threads.com/"><img src="img/threads.svg" alt="threads"></a></li>
                    </ul>
                </nav>
            </div>

            <div class="footer-contato">
                <h2>Fale Conosco</h2>
                <nav>
                    <ul>
                        <li><a href="mailto:celulose@outlook.com">Email: celulose@outlook.com</a></li>
                        <li><a href="tel:+5511920112803">Tel: (11) 92011-2803</a></li>

                    </ul>
                </nav>
            </div>
        </div>

        <div class="footer-copyright">
            <span>&copy; Celulose³ - Todos os direitos reservados - 2026.</span>
        </div>
    </footer>
</body>

</html>
